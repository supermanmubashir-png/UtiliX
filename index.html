<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b16"><meta name="description" content="UtiliX — your personal AI workspace"><link rel="manifest" href="manifest.json"><link rel="icon" href="./icon.png" type="image/png"><link rel="apple-touch-icon" href="./icon.png"><title>UtiliX</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#060914;color:#f5f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#17274a 0%,#0b142b 32%,#070b18 68%,#04060d 100%)}.scene:before,.scene:after{content:"";position:absolute;width:80vmax;height:80vmax;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none}.scene:before{background:radial-gradient(circle,#246bff,transparent 62%);left:-42vmax;top:-40vmax;animation:driftA 13s ease-in-out infinite alternate}.scene:after{background:radial-gradient(circle,#8b45ff,transparent 62%);right:-45vmax;bottom:-48vmax;animation:driftB 16s ease-in-out infinite alternate}.grid{position:absolute;inset:-50%;opacity:.12;background-image:linear-gradient(#8eb7ff20 1px,transparent 1px),linear-gradient(90deg,#8eb7ff20 1px,transparent 1px);background-size:58px 58px;transform:perspective(700px) rotateX(62deg) scale(1.5);mask-image:linear-gradient(transparent,#000 35%,#000 70%,transparent)}.orb{position:absolute;width:min(64vw,620px);aspect-ratio:1;border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%);border:1px solid #9dc7ff20;box-shadow:inset 0 0 70px #438cff12,0 0 100px #286dff12;animation:orbPulse 5s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:8%;border:1px solid #8ac2ff24;border-radius:50%;transform:rotateX(68deg) rotate(-25deg)}.orb:after{inset:18%;transform:rotateX(68deg) rotate(34deg);border-color:#bd8cff30}.energy{position:absolute;width:140vw;height:48vh;left:-20vw;top:48%;border-radius:50%;border:1px solid #6abaff28;filter:blur(1px);transform:rotate(-17deg);box-shadow:0 0 35px #3b82f633,inset 0 0 25px #3b82f622;animation:energyFlow 9s linear infinite}.energy.two{top:38%;transform:rotate(19deg) scale(.82);border-color:#a17bff26;animation-duration:13s;animation-direction:reverse}.particles{position:absolute;inset:0;overflow:hidden}.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:#b8d8ff;box-shadow:0 0 10px 2px #64aaff;opacity:0;animation:floatUp var(--duration) linear infinite;animation-delay:var(--delay)}.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:24px}.logo-wrap{width:112px;height:112px;display:grid;place-items:center;position:relative;animation:logoEntrance 1s cubic-bezier(.2,.8,.2,1) both}.logo-wrap:before{content:"";position:absolute;inset:-18px;border-radius:34px;border:1px solid #9bc7ff35;box-shadow:0 0 42px #398cff35,inset 0 0 30px #398cff18;animation:ring 3s ease-in-out infinite}.logo{width:76px;height:76px;object-fit:contain;border-radius:21px;filter:drop-shadow(0 0 24px #5499ff66);animation:logoZoom 2.1s cubic-bezier(.2,.75,.25,1) both}.wordmark{margin:0;font-size:clamp(38px,7vw,62px);font-weight:800;letter-spacing:-2.8px;line-height:1;background:linear-gradient(100deg,#fff 12%,#b7d7ff 43%,#fff 54%,#9bafff 85%);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;opacity:0;transform:translateY(16px);animation:titleIn .9s .55s ease forwards,glint 2.8s 1.45s ease-in-out both}.tagline{margin:0;color:#aab9d4;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:0;animation:fadeIn .8s 1.1s ease forwards}.loader{width:120px;height:2px;margin-top:16px;background:#ffffff17;border-radius:9px;overflow:hidden;opacity:0;animation:fadeIn .5s 1.35s forwards}.loader:after{content:"";display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,#a9d6ff,#9b8cff,transparent);box-shadow:0 0 12px #70aaff;animation:load 1.5s ease-in-out infinite}.skip{position:fixed;z-index:3;right:22px;bottom:20px;color:#b8c7df;background:#ffffff0a;border:1px solid #ffffff20;border-radius:999px;padding:9px 14px;font-size:12px;cursor:pointer;backdrop-filter:blur(12px)}.skip:hover{background:#ffffff17;color:#fff}@keyframes logoEntrance{from{opacity:0;transform:translateY(12px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes logoZoom{0%{transform:scale(.8)}35%{transform:scale(2)}68%{transform:scale(2)}100%{transform:scale(1)}}@keyframes titleIn{to{opacity:1;transform:translateY(0)}}@keyframes glint{0%,100%{background-position:100% center}45%,70%{background-position:-20% center}}@keyframes fadeIn{to{opacity:1}}@keyframes ring{0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1.08);opacity:1}}@keyframes orbPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}@keyframes energyFlow{0%{margin-left:-8%;opacity:.2}50%{opacity:.8}100%{margin-left:8%;opacity:.2}}@keyframes driftA{to{transform:translate(18vw,15vh) scale(1.15)}}@keyframes driftB{to{transform:translate(-18vw,-12vh) scale(1.2)}}@keyframes floatUp{0%{transform:translate3d(0,15vh,0) scale(.5);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translate3d(7vw,-105vh,0) scale(1.3);opacity:0}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}@media(max-width:560px){.orb{width:90vw}.logo-wrap{width:100px;height:100px}.logo{width:70px;height:70px}.wordmark{letter-spacing:-2px}.tagline{font-size:10px;letter-spacing:.16em}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="scene" aria-label="UtiliX loading screen"><div class="grid"></div><div class="orb"></div><div class="energy"></div><div class="energy two"></div><div class="particles" id="particles"></div></main><section class="center"><div class="logo-wrap"><img class="logo" src="./icon.png" alt="UtiliX logo"></div><h1 class="wordmark">UtiliX</h1><p class="tagline">Your intelligent workspace</p><div class="loader" aria-hidden="true"></div></section><button class="skip" id="skip" type="button">Open UtiliX&nbsp; →</button>
<script>
(()=>{const target='home.html';let done=false;function enter(){if(done)return;done=true;document.body.classList.add('leaving');location.replace(target)}document.getElementById('skip').addEventListener('click',enter);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const holder=document.getElementById('particles');if(!reduced){for(let i=0;i<34;i++){const p=document.createElement('i');p.className='particle';p.style.left=(Math.random()*100)+'%';p.style.top=(55+Math.random()*55)+'%';p.style.setProperty('--duration',(7+Math.random()*11)+'s');p.style.setProperty('--delay',(-Math.random()*16)+'s');holder.appendChild(p)}}setTimeout(enter,reduced?900:3400);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
